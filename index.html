<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazha & Chaya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background"></div>
    <div class="rain"></div>

    <div class="container">

        <h1>☕ Mazha & Chaya</h1>

        <div class="image-container">

            <div class="steam">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <img src="assets/tea.jpeg"
                 class="tea-image"
                 alt="Tea">

        </div>

        <div class="controls">

            <label>🎵 Music</label>
            <input type="range"
                   id="musicSlider"
                   min="0"
                   max="100"
                   value="50">

            <label>☕ Tea Shop</label>
            <input type="range"
                   id="ambienceSlider"
                   min="0"
                   max="100"
                   value="50">

            <label>🌧️ Rain</label>
            <input type="range"
                   id="rainSlider"
                   min="0"
                   max="100"
                   value="50">

        </div>

        <button id="playPauseBtn">
            ▶ Enter Tea Shop
        </button>

    </div>

    <audio id="music"></audio>

    <audio id="ambience" loop>
        <source src="assets/ambience.mp3" type="audio/mpeg">
    </audio>

    <audio id="rainAudio" loop>
        <source src="assets/rain.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>
</html>
